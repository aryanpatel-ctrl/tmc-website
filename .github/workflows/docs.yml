# Documentation checks (reusable workflow, called from pipeline.yml by the integrator).
#
#   check   every relative link and #anchor in README.md and docs/ resolves (offline, no network);
#           docs/THIRD-PARTY-LICENSES.md matches the components actually used and every component has
#           a recorded licence (SOW §8.2, §13; R-8.2-7, R-13-2)
#   build   optional: DOCX + PDF of the whole documentation set, uploaded as a workflow artifact
#           ("editable and portable formats", SOW §4.15; R-4.15-9). Enable for releases/handover.
#
# Wiring (pipeline.yml):
#   docs:
#     uses: ./.github/workflows/docs.yml
#     with:
#       ref: ${{ inputs.ref || github.sha }}
#       build: ${{ github.ref == 'refs/heads/main' }}
name: Documentation

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, tag or branch to check (default: the calling commit)"
        type: string
        required: false
        default: ""
      build:
        description: "Also build the DOCX and PDF documentation set and upload it as an artifact"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Documentation links and licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Links and anchors in README.md and docs/
        run: python3 scripts/docs/check-links.py
      - name: Third-party licence inventory is current and complete
        run: ./scripts/licenses.sh --check

  build:
    name: Documentation set (DOCX + PDF)
    if: ${{ inputs.build }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build documentation
        run: ./scripts/docs/build-docs.sh
      - name: Upload documentation set
        uses: actions/upload-artifact@v7
        with:
          name: tmc-documentation-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/docs/
          if-no-files-found: error
          retention-days: 90
