# TMC website demo — routes the TMC multisite hostnames to the tmc-wp container.
# Installed into nginx-proxy-manager as /data/nginx/custom/http.conf
# Undo: delete that file and run `docker exec nginx-proxy-manager nginx -s reload`

server {
    listen 80;
    listen [::]:80;
    server_name tmc.100-79-142-44.sslip.io *.tmc.100-79-142-44.sslip.io;

    client_max_body_size 64m;

    # Resolve the container at request time, so NPM still starts if tmc-wp is down
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tmc_upstream http://tmc-wp:80;

    location / {
        proxy_pass $tmc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
