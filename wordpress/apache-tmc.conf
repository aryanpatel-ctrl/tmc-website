# Hide version details
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Real client IP from the reverse proxy (needed for audit logs)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Browser features no TMC page uses are switched off for every response (W2 security).
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-site"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    # Content-Security-Policy and HSTS depend on the request: set by tmc-core/security-headers.php.
</IfModule>

# Never execute PHP from the uploads folder
<DirectoryMatch "^/var/www/html/wp-content/uploads">
    <FilesMatch "\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# XML-RPC is not needed (brute-force / DDoS vector)
<Files "xmlrpc.php">
    Require all denied
</Files>

# ---- Performance (tender §4.7 / §4.10) --------------------------------------------------------
# Compression: Brotli for clients that accept it, gzip otherwise. HTML from PHP (including pages
# served by the TMC page cache) is compressed here too.
<IfModule mod_brotli.c>
    AddOutputFilterByType BROTLI_COMPRESS;DEFLATE text/html text/plain text/css text/xml text/calendar text/javascript application/javascript application/json application/ld+json application/xml application/rss+xml application/atom+xml image/svg+xml
    BrotliCompressionQuality 5
</IfModule>
<IfModule !mod_brotli.c>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/calendar text/javascript application/javascript application/json application/ld+json application/xml application/rss+xml application/atom+xml image/svg+xml
    </IfModule>
</IfModule>

# Browser caching of static files (PHP responses never match these file names).
<IfModule mod_headers.c>
    # Theme/core/plugin assets are requested as file.css?ver=<version>: a new version is a new URL,
    # so versioned URLs are cached for a year. Unversioned URLs (fonts, images referenced from CSS)
    # for a week, so a replaced file still reaches visitors quickly.
    <FilesMatch "\.(css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$">
        <If "%{QUERY_STRING} =~ /(^|&)ver=/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </If>
        <Else>
            Header set Cache-Control "public, max-age=604800"
        </Else>
    </FilesMatch>
    # Documents (tenders, notices, forms) can be corrected and re-uploaded: one day.
    <FilesMatch "\.(pdf|docx?|xlsx?|pptx?|odt|ods|odp|csv|zip|mp4|webm|mp3|ogg)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
