# OWASP ZAP baseline scan rules for the TMC website (used by .github/workflows/security.yml).
#
# Format: rule-id <TAB> IGNORE|INFO|WARN|FAIL <TAB> (name) - justification.
# Rules not listed here are reported as WARN. FAIL stops the release. Every WARN/IGNORE below is an
# accepted finding with its justification; review this file before each release and before VAPT
# (docs/security/owasp-top10.md, section 'Accepted DAST findings').
#
# ---- must never occur: the release fails
10003	FAIL	(Vulnerable JS Library) - front end ships only project JS and current WordPress core scripts
10009	FAIL	(In Page Banner Information Leak) - ServerSignature Off
10017	FAIL	(Cross-Domain JavaScript Source File Inclusion) - no external scripts at runtime
10019	FAIL	(Content-Type Header Missing)
10020	FAIL	(Anti-clickjacking Header) - X-Frame-Options and CSP frame-ancestors on every response
10021	FAIL	(X-Content-Type-Options Header Missing) - set by Apache for every response
10023	FAIL	(Information Disclosure - Debug Error Messages)
10035	FAIL	(Strict-Transport-Security Header) - only raised on HTTPS responses; HSTS is sent on HTTPS
10036	FAIL	(Server Leaks Version Information via Server header) - ServerTokens Prod
10037	FAIL	(Server Leaks Information via X-Powered-By) - expose_php Off
10038	FAIL	(Content Security Policy Header Not Set) - security-headers.php
10039	FAIL	(X-Backend-Server Header Information Leak)
10040	FAIL	(Secure Pages Include Mixed Content)
10041	FAIL	(HTTP to HTTPS Insecure Transition in Form Post)
10042	FAIL	(HTTPS to HTTP Insecure Transition in Form Post)
10052	FAIL	(X-ChromeLogger-Data Header Information Leak)
10056	FAIL	(X-Debug-Token Information Leak)
10063	FAIL	(Permissions Policy Header Not Set) - set by Apache for every response
10098	FAIL	(Cross-Domain Misconfiguration)
10099	FAIL	(Source Code Disclosure)
10115	FAIL	(Script Served From Malicious Domain)
90003	FAIL	(Sub Resource Integrity Attribute Missing) - there must be no third-party resources at all
90022	FAIL	(Application Error Disclosure)
3	FAIL	(Session ID in URL Rewrite)
#
# ---- accepted, reported for review (see justification)
10010	WARN	(Cookie No HttpOnly Flag) - pll_language (Polylang) holds only the visitor's language choice and is read by the language switcher; WordPress login cookies are HttpOnly
10011	WARN	(Cookie Without Secure Flag) - CI scans plain HTTP; on HTTPS WordPress and Polylang set the Secure flag
10054	WARN	(Cookie without SameSite Attribute) - reviewed per cookie; WordPress auth cookies are path-scoped and nonce-protected
10055	WARN	(CSP) - style-src allows 'unsafe-inline' because WordPress core block supports print inline style attributes (no script execution); login/admin screens use a baseline policy because core still prints inline scripts there. Scripts on public pages are nonce-only
10202	WARN	(Absence of Anti-CSRF Tokens) - the public search form is a GET form without side effects; all state-changing forms use WordPress nonces
90004	WARN	(Insufficient Site Isolation Against Spectre) - COOP same-origin and CORP same-site are set; COEP require-corp is not, because it would block shared network assets without adding protection for a site that holds no secrets in public pages
90033	WARN	(Loosely Scoped Cookie) - pll_language is scoped to the network domain so the language choice follows the visitor across TMC sites; it holds no personal data
10027	WARN	(Information Disclosure - Suspicious Comments) - comments in minified WordPress core JavaScript (e.g. 'TODO', 'user'); reviewed, no sensitive data
10110	WARN	(Dangerous JS Functions) - pattern match in WordPress core libraries; project JS uses no eval/innerHTML with untrusted data
10108	WARN	(Reverse Tabnabbing) - external links opening in a new tab get rel=noopener from the theme
#
# ---- informational only, not findings
10015	IGNORE	(Re-examine Cache-control Directives) - public pages are intentionally cacheable
10049	IGNORE	(Storable and Cacheable Content) - informational
10050	IGNORE	(Retrieved from Cache) - informational
10096	IGNORE	(Timestamp Disclosure - Unix) - asset version query strings (?ver=<file mtime>) and dates in content; not sensitive
10109	IGNORE	(Modern Web Application) - informational
10111	IGNORE	(Authentication Request Identified) - informational
10112	IGNORE	(Session Management Response Identified) - informational
10113	IGNORE	(Verification Request Identified) - informational
10116	IGNORE	(ZAP is Out of Date) - the ZAP version is pinned on purpose; bumped deliberately
