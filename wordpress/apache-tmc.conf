# Hide version details
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Real client IP from the reverse proxy (needed for audit logs)
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Browser features no TMC page uses are switched off for every response (W2 security).
    Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-site"
    Header always set X-Permitted-Cross-Domain-Policies "none"
    # Content-Security-Policy and HSTS depend on the request: set by tmc-core/security-headers.php.
</IfModule>

# Never execute PHP from the uploads folder
<DirectoryMatch "^/var/www/html/wp-content/uploads">
    <FilesMatch "\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# XML-RPC is not needed (brute-force / DDoS vector)
<Files "xmlrpc.php">
    Require all denied
</Files>
