# Weekly check of pinned WordPress components (tender §6, R-6-3: upgrades of core and plugins;
# security patches within 30 days, critical on priority). Dependabot (.github/dependabot.yml) opens
# PRs for images and actions; this compares the plugins pinned in scripts/*.sh and the WordPress
# release in the web image with wordpress.org and keeps one tracking issue up to date.
# Process: docs/operations/patching.md. Standalone (not called from pipeline.yml).
name: Update check

on:
  schedule:
    - cron: "30 22 * * 0"   # Monday 04:00 IST, with the Dependabot run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pinned:
    name: Pinned WordPress components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Compare with wordpress.org
        id: check
        run: |
          rc=0
          ./scripts/ops/check-updates.sh --out "$RUNNER_TEMP/updates.md" || rc=$?
          cat "$RUNNER_TEMP/updates.md" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 1 ]; then echo "::error::wordpress.org could not be reached — check by hand"; exit 1; fi

      - name: Open or update the tracking issue
        if: steps.check.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Updates available for pinned WordPress components"
          {
            cat "$RUNNER_TEMP/updates.md"
            echo
            echo "Raise the pinned version in the script named above in a pull request; CI and the UAT"
            echo "deployment test it, then it is released to production. Security releases: within 30 days,"
            echo "critical ones on priority (docs/operations/patching.md)."
            echo
            echo "_Updated by the Update check workflow, run ${GITHUB_RUN_ID}._"
          } > "$RUNNER_TEMP/issue.md"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
