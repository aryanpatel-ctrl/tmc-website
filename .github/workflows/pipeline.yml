# CI/CD for the TMC website ecosystem.
#
#   pull request  → every check below (GitHub-hosted runners only; never touches the server)
#   push to main  → every check below → deploy to UAT (self-hosted runner on hetser)
#   manual run    → redeploy or roll back: Actions → Pipeline → Run workflow → enter a commit/tag
#
# Every deployment is tested first, backed up, smoke-tested and recorded (tender §4.7: controlled,
# auditable promotion between environments with rollback). Production is promoted separately from
# a v* tag on a commit that passed this pipeline on main (release.yml, with manual approval).
#
#   Lint ──┬── Integration test (all six sites, PHP suites, smoke test)
#          ├── Security gate (security.yml: gitleaks, Trivy, OWASP ZAP)          ─┐
#          ├── Quality gates (quality.yml: E2E, visual, axe, HTML, Lighthouse,    │  each on its own
#          │                  links + Go-Live acceptance report)                  │  fresh stack, in
#          ├── DR drill (dr-drill.yml: backup → off-host copy → restore)          │  parallel
#          └── Capacity (capacity.yml: k6 against the page cache + search)       ─┘
#   Operations checks, application gateway checks and documentation checks need no stack and run
#   alongside Lint. Deploy waits for all of them.
name: Pipeline

on:
  push:
    branches: [main, "feat/**"]   # feature branches get full CI; only main deploys
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag or branch to deploy (use an older commit to roll back)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REF: ${{ inputs.ref || github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Static checks (PHP, JSON, JS, shell)
        run: ./scripts/lint.sh
      - name: Compose files resolve
        run: |
          ./scripts/make-env.sh ci
          docker compose config --quiet
          docker compose -f docker-compose.yml -f compose.server.yml config --quiet

  ops:
    name: Operations
    uses: ./.github/workflows/ops-checks.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  gateway:
    name: Application gateway
    uses: ./.github/workflows/apps-gateway.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  integration:
    name: Integration test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Environment
        run: ./scripts/make-env.sh ci
      - name: Build and provision all six sites
        run: ./scripts/setup.sh
      - name: Demo accounts
        run: ./scripts/create-demo-users.sh
      - name: Test suites (scripts/tests/*-test.php)
        run: ./scripts/run-tests.sh
      - name: HTTP smoke test
        run: ./scripts/smoke-test.sh
      - name: Provisioning is idempotent (second run of setup.sh on the provisioned stack)
        run: ./scripts/setup.sh > "$RUNNER_TEMP/setup-rerun.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/setup-rerun.log"; exit 1; }
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200 wordpress db cron backup tmc-apps-mock

  security:
    name: Security gate
    needs: lint
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  quality:
    name: Quality gates
    needs: lint
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  dr-drill:
    name: DR drill
    needs: lint
    uses: ./.github/workflows/dr-drill.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  capacity:
    name: Capacity
    needs: lint
    uses: ./.github/workflows/capacity.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  deploy:
    name: Deploy to UAT (hetser)
    needs: [lint, ops, gateway, docs, integration, security, quality, dr-drill, capacity]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, tmc-server]
    timeout-minutes: 30
    concurrency:
      group: deploy-uat
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
      - name: Deploy
        env:
          TMC_DEPLOY_TARGET: uat
        run: ./scripts/deploy.sh "$GITHUB_WORKSPACE" "$HOME/docker/tmc-website"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment to UAT"
            echo "- Commit: \`$(git rev-parse --short HEAD)\` — $(git log -1 --pretty=%s)"
            echo "- Triggered by: ${GITHUB_ACTOR} (${GITHUB_EVENT_NAME})"
            echo "- Gates passed: lint, integration, security, quality, DR drill, capacity, operations, gateway, documentation"
            echo "- Site: http://tmc.100-79-142-44.sslip.io (Tailscale only)"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
